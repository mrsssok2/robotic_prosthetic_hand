<style>.b{fill:#f4f5f7;stroke:#8a909a;stroke-width:1.2}.y{fill:#dce8fb;stroke:#2a6fdb;stroke-width:1.5}.m{fill:#ececee;stroke:#6b7280;stroke-width:1.5}.c{fill:#fbe9d6;stroke:#d9822b;stroke-width:1.5}.g{fill:#e3f3e6;stroke:#3a8f4f;stroke-width:1.5}text{fill:#1f2328}.s{font-size:11px;fill:#555}</style>
