<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand tracker</title>
<style>
  body { margin: 0; font: 16px system-ui, sans-serif; background: #111; color: #eee; text-align: center; }
  #wrap { position: relative; display: inline-block; margin-top: 12px; }
  video, canvas { width: 640px; max-width: 95vw; transform: scaleX(-1); border-radius: 8px; }
  canvas { position: absolute; left: 0; top: 0; }
  #status { margin: 10px; min-height: 1.5em; }
  .ok { color: #7fdc7f; } .bad { color: #ff8a80; }
</style>
</head>
<body>
<div id="wrap"><video id="v" autoplay playsinline muted></video><canvas id="c"></canvas></div>
<div id="status">starting…</div>
<script type="module">
import { HandLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const status = document.getElementById("status");
const video = document.getElementById("v");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const say = (t, cls = "") => { status.textContent = t; status.className = cls; };

let ws, wsOpen = false;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { wsOpen = true; };
  ws.onclose = () => { wsOpen = false; setTimeout(connect, 1000); };
}
connect();

try {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const landmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numHands: 1,
  });
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  await video.play();
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const draw = new DrawingUtils(ctx);

  let lastTs = -1, frames = 0, t0 = performance.now();
  function loop() {
    if (video.currentTime !== lastTs) {
      lastTs = video.currentTime;
      const res = landmarker.detectForVideo(video, performance.now());
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let msg = { hand: null };
      if (res.landmarks.length) {
        draw.drawConnectors(res.landmarks[0], HandLandmarker.HAND_CONNECTIONS, { color: "#7fdc7f", lineWidth: 3 });
        draw.drawLandmarks(res.landmarks[0], { color: "#fff", radius: 3 });
        const cat = res.handedness[0][0];
        // world landmarks are metric (metres), the best input for joint angles
        msg = { hand: cat.categoryName, score: cat.score, lm: res.worldLandmarks[0].map(p => [p.x, p.y, p.z]) };
      }
      if (wsOpen) ws.send(JSON.stringify(msg));
      frames++;
      const now = performance.now();
      if (now - t0 > 1000) {
        const fps = (frames * 1000 / (now - t0)).toFixed(0);
        say(`${wsOpen ? "connected to ROS" : "waiting for ROS bridge…"} · ${fps} fps · ${res.landmarks.length ? "hand" : "no hand"}`,
            wsOpen ? "ok" : "bad");
        frames = 0; t0 = now;
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
} catch (e) {
  say("error: " + e.message, "bad");
}
</script>
</body>
</html>
